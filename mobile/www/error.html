<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ایران‌گلس‌فلیت</title>
<style>
  :root { --bg: #f5f5f7; --text: #1d1d1f; --muted: #6e6e73; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f5f5f7; --muted: #98989d; } }
  body { margin: 0; min-height: 100svh; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center;
    background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
  h1 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; color: var(--muted); line-height: 1.8; }
  button { justify-self: center; margin-top: 10px; padding: 14px 28px; border: 0; border-radius: 99px; background: #0071e3; color: #fff; font: inherit; font-weight: 600; }
</style>
</head>
<body>
  <svg width="64" height="64" viewBox="0 0 32 32" style="justify-self:center"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#0a60ff"/></linearGradient></defs><path d="M5 11.5Q16 3.5 27 11.5L24.6 25Q16 21.8 7.4 25Z" fill="url(#g)"/></svg>
  <h1>اتصال برقرار نشد</h1>
  <p>اینترنت را بررسی کنید و دوباره تلاش کنید.<br><span dir="ltr">No connection. Check your internet and try again.</span></p>
  <button onclick="history.back(); setTimeout(() => location.reload(), 300)">تلاش دوباره · Retry</button>
</body>
</html>
