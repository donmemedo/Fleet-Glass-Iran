# Both services run as non-root on a read-only root filesystem with every Linux capability dropped,
# bounded memory/process counts, and rotated logs so a flood cannot fill the disk.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  pids_limit: 256
  mem_limit: 512m
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  backend:
    <<: *hardened
    build: ./backend
    environment:
      # Optional: 32+ random characters (openssl rand -hex 32) turn on the admin lead list at /dashboard#admin.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  frontend:
    <<: *hardened
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # Localhost only by default: put a TLS reverse proxy (Caddy, nginx) in front. WEB_BIND=0.0.0.0 serves plain HTTP to the network.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
