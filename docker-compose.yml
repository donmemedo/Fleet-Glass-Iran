# Both services run as non-root on a read-only root filesystem with every Linux capability dropped.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  backend:
    <<: *hardened
    build: ./backend
    environment:
      # Optional: 32+ random characters (openssl rand -hex 32) turn on the admin lead list at /dashboard#admin.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  frontend:
    <<: *hardened
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
